<!DOCTYPE html>
<html data-theme="dark">

<head>
  <title>Processing Mockup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="pikaraoke/static/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="pikaraoke/static/bulma.min.css">
  <link rel="stylesheet" href="pikaraoke/static/bulma-dark.css">
  <link rel="stylesheet" href="pikaraoke/static/custom.css">
  <link rel="stylesheet" href="pikaraoke/static/fontello/css/fontello.css">

<style>
/* ==========================================================================
   ICON COLUMN SIZES - Configure all icon column widths here
   ========================================================================== */
:root {
  --icon-col-download: 1.75rem;   /* Download status column */
  --icon-col-process: 1.75rem;    /* Processing status column */
  --icon-col-queue: 2rem;    /* Queue action column */
  --icon-col-cancel: 2rem;  /* Cancel/Remove action column */

/* Icon sizes */
--spinner-size: 1.375em; /* CSS-generated spinner diameter */
--spinner-speed: 2s; /* Spinner rotation duration (lower = faster) */
--spinner-y-offset: -0.06em; /* Vertical adjustment to align with Fontello icons (tweak as needed) */
--icon-size-clock: 1.5em; /* Pending state icon */
--icon-size-ok: 1.5em; /* Complete state icon */
--icon-size-error: 1.6em; /* Error state icon */
--icon-size-queue: 1.6em; /* Queue action icon */
--icon-size-cancel: 1.6em; /* Cancel/Remove action icon */
--icon-size-header: 1.5em; /* Table header icons */

/* Icon colors */
--icon-color-spinner: var(--bulma-grey); /* Active spinner - matches progress label */
--icon-color-spinner-dim: color-mix(in srgb, var(--bulma-grey) 30%, transparent); /* Spinner background track */
--icon-color-cancelling: var(--bulma-danger); /* Cancelling state (spinner + label) */
--icon-color-clock: var(--bulma-grey); /* Pending state (clock) */
--icon-color-ok: var(--bulma-grey); /* Complete state */
--icon-color-error: var(--bulma-grey); /* Error state */
--icon-color-queue: var(--bulma-primary); /* Queue action (teal) */
--icon-color-cancel: var(--bulma-danger); /* Cancel action (red) */
--icon-color-remove: var(--bulma-danger); /* Remove action (red) */
--icon-color-header: inherit; /* Table header icons - matches table header text */

/* Text colors */
--text-color-progress: var(--bulma-grey); /* Progress labels (downloading, separating) */
}

tr:nth-child(even) { background-color: rgb(50, 55, 55); }

    .is-truncated {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

/* Fixed-width icon columns */
.col-icon-download { width: var(--icon-col-download); text-align: center; vertical-align: middle; padding: 0; }
.col-icon-process { width: var(--icon-col-process); text-align: center; vertical-align: middle; padding: 0; }
.col-icon-queue { width: var(--icon-col-queue); text-align: center; vertical-align: middle; padding: 0; }
.col-icon-cancel { width: var(--icon-col-cancel); text-align: center; vertical-align: middle; padding: 0; }

    #pipeline-table th[class^="col-icon"] .icon { color: var(--icon-color-header) !important; font-size: var(--icon-size-header); }

    /* Title cell */
    .col-title {
        vertical-align: middle;
    }
    .title-row {
        display: flex;
        align-items: center;
        min-width: 0;
    }
    .title-row .is-truncated {
        flex: 1 1 auto;
        min-width: 0;
    }
    .progress-label { flex: 0 0 auto; margin-left: 0.5em; color: var(--text-color-progress); }
.progress-label.cancelling { color: var(--icon-color-cancelling); }

    /* Strip Bulma's cell padding so icon columns align predictably.
       Bulma's typography is unaffected — only spacing is overridden. */
    #pipeline-table th, #pipeline-table td { padding: 0; vertical-align: middle; }
    #pipeline-table td:first-child { padding: 0.5em 0.25rem 0.5em 0; }

/* Common wrapper — all state icons sit in identical boxes */
.state-box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--spinner-size);
  height: var(--spinner-size);
  vertical-align: middle;
  line-height: 1;
}
/* CSS-Generated spinner - replaces Fontello icon-spin3 */
.spinner-css {
  display: inline-block;
  width: var(--spinner-size);
  height: var(--spinner-size);
  border: calc(var(--spinner-size) * 0.13) solid var(--icon-color-spinner-dim);
  border-top-color: var(--icon-color-spinner);
  border-right-color: var(--icon-color-spinner);
  border-radius: 50%;
  animation: spin var(--spinner-speed) linear infinite;
  margin-top: var(--spinner-y-offset);
}

/* Grey spinner for cancelling state */
.spinner-css.cancelling {
  border-top-color: var(--icon-color-cancelling);
  border-right-color: var(--icon-color-cancelling);
}

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

/* Fontello icons inside .state-box — reset line-height/margins */
.state-box > .icon,
.state-box > a > .icon {
  line-height: 1;
  margin: 0;
}
.state-box > .icon.icon-clock,
.state-box > a > .icon.icon-clock { font-size: var(--icon-size-clock); color: var(--icon-color-clock); }
.state-box > .icon.icon-ok,
.state-box > a > .icon.icon-ok { font-size: var(--icon-size-ok); }
.state-box > .icon.icon-state-error,
.state-box > a > .icon.icon-state-error { font-size: var(--icon-size-error); }
.state-box > a > .icon.icon-action-queue { font-size: var(--icon-size-queue); }
.state-box > a > .icon.icon-action-cancel,
.state-box > a > .icon.icon-action-remove { font-size: var(--icon-size-cancel); }
.icon-state-ok { color: var(--icon-color-ok); }
.icon-state-error { color: var(--icon-color-error); }
.icon-state-cancelling { color: var(--icon-color-cancelling); }

/* Action icons */
.pipeline-action-btn { text-decoration: none; }
.icon-action-queue { color: var(--icon-color-queue); }
.icon-action-cancel { color: var(--icon-color-cancel); }
.icon-action-remove { color: var(--icon-color-remove); }
  </style>
</head>

<body>
  <div class="container" style="padding: 5px; max-width: 900px;">
    <div class="box" style="margin-top: 5px;">
      <header class="title">
        <h1>Processing</h1>
      </header>
      <div class="content">
        <table class="table is-striped is-fullwidth" id="pipeline-table">
          <thead>
      <tr>
        <th>Title</th>
        <th class="col-icon-download"><span class="state-box"><i class="icon icon-down-big"></i></span></th>
        <th class="col-icon-process"><span class="state-box"><i class="icon icon-music"></i></span></th>
        <th class="col-icon-queue"></th>
        <th class="col-icon-cancel"></th>
      </tr>
          </thead>
          <tbody id="pipeline-body"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
(function() {
    'use strict';

    var mockItems = [
        {
            id: '1',
            title: 'Download: pending · Processing: pending',
            download_status: 'pending',
            processing_status: 'pending',
            error_message: null,
            song_path: null
        },
        {
            id: '2',
            title: 'Download: active (42%) · Processing: pending',
            download_status: 'active',
            processing_status: 'pending',
            error_message: null,
            song_path: null
        },
        {
            id: '3',
            title: 'Download: complete · Processing: pending',
            download_status: 'complete',
            processing_status: 'pending',
            error_message: null,
            song_path: null
        },
        {
            id: '4',
            title: 'Download: complete · Processing: active',
            download_status: 'complete',
            processing_status: 'active',
            error_message: null,
            song_path: null
        },
        {
            id: '5',
            title: 'Download: complete · Processing: complete — enqueue available',
            download_status: 'complete',
            processing_status: 'complete',
            error_message: null,
            song_path: '/songs/Sweet Caroline---abc12345678.mp4'
        },
        {
            id: '6',
            title: 'Download: error — long error message that should be truncated eventually when the window is narrow enough',
            download_status: 'error',
            processing_status: 'pending',
            download_progress: 0,
            error_message: 'ERROR: Video unavailable. This video has been removed by the uploader.',
            song_path: null
        },
        {
            id: '7',
            title: 'Download: complete · Processing: error',
            download_status: 'complete',
            processing_status: 'error',
            error_message: null,
            song_path: null
        },
        {
            id: '8',
            title: 'Download: cancelling · Processing: cancelling',
            download_status: 'cancelling',
            processing_status: 'cancelling',
            error_message: null,
            song_path: null
        },
        {
            id: '9',
            title: 'Download: complete · Processing: cancelling',
            download_status: 'complete',
            processing_status: 'cancelling',
            error_message: null,
            song_path: null
        },
        {
            id: '10',
            title: 'Download: complete · Processing: complete — no path, remove only',
            download_status: 'complete',
            processing_status: 'complete',
            error_message: null,
            song_path: null  // complete but no path — remove, not enqueue
        }
    ];

    function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

function stateIcon(status, isCancellingContext) {
  var inner = '';
  if (status === 'pending') inner = '<i class="icon icon-clock"></i>';
  else if (status === 'active') inner = '<span class="spinner-css"></span>';
  else if (status === 'complete') inner = '<i class="icon icon-ok ' + (isCancellingContext ? 'icon-state-cancelling' : 'icon-state-ok') + '"></i>';
  else if (status === 'error') inner = '<i class="icon icon-cancel-circled-1 icon-state-error"></i>';
  else if (status === 'cancelling') inner = '<span class="spinner-css cancelling"></span>';
  else return '';
  return '<span class="state-box">' + inner + '</span>';
}

    function queueCell(item) {
        if (item.download_status === 'complete' && item.processing_status === 'complete' && item.song_path) {
            return '<span class="state-box"><a href="#" class="pipeline-action-btn" title="Queue">'
                 + '<i class="icon icon-list-add icon-action-queue"></i></a></span>';
        }
        return '';
    }

    function cancelCell(item) {
        if (item.processing_status === 'cancelling') return '';
        if (item.download_status === 'active'   || item.download_status === 'pending' ||
            item.processing_status === 'active' || item.processing_status === 'pending') {
            return '<span class="state-box"><a href="#" class="pipeline-action-btn" title="Cancel">'
                 + '<i class="icon icon-cancel-circled-1 icon-action-cancel"></i></a></span>';
        }
        if (item.download_status === 'complete' || item.download_status === 'error' ||
            item.processing_status === 'complete' || item.processing_status === 'error') {
            return '<span class="state-box"><a href="#" class="pipeline-action-btn" title="Remove">'
                 + '<i class="icon icon-trash-empty icon-action-remove"></i></a></span>';
        }
        return '';
    }

    function progressLabel(item) {
        if (item.download_status === 'cancelling' || item.processing_status === 'cancelling')
            return 'cancelling';
        if (item.download_status === 'active')    return 'downloading';
        if (item.processing_status === 'active')  return 'separating';
        return '';
    }

function renderRow(item) {
  var label = progressLabel(item);
  var isCancelling = item.download_status === 'cancelling' || item.processing_status === 'cancelling';
  var labelClass = isCancelling ? 'progress-label is-size-7 cancelling' : 'progress-label is-size-7';
  var labelHtml = label
    ? '<span class="' + labelClass + '">' + label + '</span>'
    : '';

        var titleHtml = '<td class="col-title">';
        titleHtml += '<div class="title-row">';
        titleHtml += '<span class="is-truncated" title="' + escapeHtml(item.title) + '">' + escapeHtml(item.title) + '</span>';
        titleHtml += labelHtml;
        titleHtml += '</div>';
        if (item.error_message && item.download_status === 'error') {
            titleHtml += '<span class="is-size-7 has-text-danger" title="' + escapeHtml(item.error_message) + '">'
                       + escapeHtml(item.error_message.substring(0, 80)) + '</span>';
        }
        titleHtml += '</td>';

var isCancellingContext = item.download_status === 'cancelling' || item.processing_status === 'cancelling';
return '<tr data-id="' + item.id + '">'
    + titleHtml
    + '<td class="col-icon-download">' + stateIcon(item.download_status, isCancellingContext) + '</td>'
    + '<td class="col-icon-process">' + stateIcon(item.processing_status, isCancellingContext) + '</td>'
    + '<td class="col-icon-queue">' + queueCell(item) + '</td>'
    + '<td class="col-icon-cancel">' + cancelCell(item) + '</td>'
    + '</tr>';
    }

    function removeRow(id, delay) {
        var $row = $('tr[data-id="' + id + '"]');
        if (delay) {
            setTimeout(function() { $row.fadeOut(1000, function() { $(this).remove(); }); }, delay);
        } else {
            $row.fadeOut(1000, function() { $(this).remove(); });
        }
    }

    function updateRow(id) {
        var item = mockItems.find(function(i) { return i.id === id; });
        if (!item) return;
        $('tr[data-id="' + id + '"]').replaceWith(renderRow(item));
    }

    $(function() {
        var html = '';
        mockItems.forEach(function(item) { html += renderRow(item); });
        $('#pipeline-body').html(html);

        // Cancel / Remove button
        $(document).on('click', '.col-icon-cancel a[title="Cancel"]', function(e) {
            e.preventDefault();
            var id = $(this).closest('tr').data('id').toString();
            var item = mockItems.find(function(i) { return i.id === id; });
            if (!item) return;

            if (item.download_status === 'active' || item.download_status === 'pending') {
                // Cancel download: immediate removal
                removeRow(id);
            } else if (item.processing_status === 'pending') {
                // Cancel pending processing: immediate removal
                removeRow(id);
            } else if (item.processing_status === 'active') {
                // Cancel active processing: show cancelling state, then remove after delay
                item.download_status = 'cancelling';
                item.processing_status = 'cancelling';
                updateRow(id);
                removeRow(id, 5000);
            }
        });

        $(document).on('click', '.col-icon-cancel a[title="Remove"]', function(e) {
            e.preventDefault();
            var id = $(this).closest('tr').data('id').toString();
            removeRow(id);
        });

        // Queue / Enqueue button
        $(document).on('click', '.col-icon-queue a[title="Queue"]', function(e) {
            e.preventDefault();
            var id = $(this).closest('tr').data('id').toString();
            removeRow(id);
        });
    });
})();
</script>

</body>
</html>
