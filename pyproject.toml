[project]
name = "pikaraoke"
version = "1.19.0"
description = "Karaoke machine with automatic vocal removal and lyric subtitle generation"
authors = [{name = "Vic Wong"}]
maintainers = [{name = "kagebarton"}]
readme = "docs/README.md"
requires-python = ">=3.10"
keywords = ["karaoke", "ktv", "video", "audio", "youtube", "lyrics", "whisper", "stem-separation", "linux"]
classifiers = [
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Games/Entertainment"
]
dependencies = [
    "Flask>=3.1.0,<3.1.3", # 3.1.3 breaks flask-socketio; remove cap when fixed
    "qrcode[png]==8.2",
    "psutil==7.2.1",
    "requests==2.32.5",
    "flask-paginate==2024.4.12",
    "flask-smorest>=0.46.0",
    "Babel==2.17.0",
    "Flask-Babel==4.0.0",
    "marshmallow>=3.0", # imported directly by route schemas (also a flask-smorest dep)
    "Pillow>=10.0", # imported directly by mpv_controller (also a qrcode[png] dep)
    "pyzmq>=25.0", # mpv_controller IPC
    "yt-dlp[default]>=2026.03.03",
    "curl_cffi>=0.10,<0.15", # Required for yt-dlp --impersonate; range matches yt-dlp's supported versions
    "flask-socketio>=5.5.0",
    "python-mpv>=1.0.7",
    "audio-separator[gpu]>=0.30",
    "stable-ts>=2.17",
    "faster-whisper>=1.0.3",
    "srt>=3.5.3",
    "torch>=2.2",
    "lyricsgenius>=3.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",

]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[project.scripts]
pikaraoke = "pikaraoke.app:main"

[project.urls]
Homepage = "https://github.com/kagebarton/pikaraoke"
Repository = "https://github.com/kagebarton/pikaraoke"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pikaraoke"]

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
ignore = ["src/oldstuff"]
defineConstant = { DEBUG = true }
stubPath = "src/stubs"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.10"
pythonPlatform = "Linux"

[tool.coverage.run]
omit = [
    "pikaraoke/constants.py",
    "pikaraoke/app.py",
    "pikaraoke/lib/current_app.py",
    "pikaraoke/lib/args.py",
]
