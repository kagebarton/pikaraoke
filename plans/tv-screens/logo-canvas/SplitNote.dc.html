<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo 5: Split note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1abc9c}a:hover{color:#1dd2af}
</style>
</helmet>
<div style="width: 960px; height: 540px; box-sizing: border-box; padding: 48px; background: {{bg}}; color: #ffffff; font-family: Lato, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 28px">
<svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="GPUKaraoke mark: a music note whose head is split in two, voice and music">
<path d="M74 112A36 36 0 0 0 74 184Z" fill="#f1b70e"></path>
<path d="M82 112A36 36 0 0 1 82 184Z" fill="#1abc9c"></path>
<rect x="106" y="24" width="12" height="112" fill="#ffffff"></rect>
<path d="M106 24H118A56 56 0 0 1 174 80H154A36 36 0 0 0 118 44H106Z" fill="#ffffff"></path>
</svg>
<span style="font-size: 92px; font-weight: 900; letter-spacing: -2px; line-height: 1"><span style="color: #1abc9c">gpu</span>karaoke</span>
</div>
<div style="display: flex; align-items: center; gap: 40px; padding-top: 20px; border-top: 1px solid #282f2f">
<span style="font-size: 13px; color: #8c9b9d">Small sizes</span>
<svg width="48" height="48" viewBox="0 0 200 200" aria-hidden="true">
<path d="M72 106A40 40 0 0 0 72 186Z" fill="#f1b70e"></path>
<path d="M82 106A40 40 0 0 1 82 186Z" fill="#1abc9c"></path>
<rect x="104" y="20" width="18" height="110" fill="#ffffff"></rect>
<path d="M104 20H122A56 56 0 0 1 178 76H152A30 30 0 0 0 122 46H104Z" fill="#ffffff"></path>
</svg>
<span style="display: flex; align-items: center; gap: 10px">
<svg width="28" height="28" viewBox="0 0 200 200" aria-hidden="true">
<path d="M70 100A46 46 0 0 0 70 192Z" fill="#f1b70e"></path>
<path d="M84 100A46 46 0 0 1 84 192Z" fill="#1abc9c"></path>
<rect x="104" y="12" width="26" height="116" fill="#ffffff"></rect>
<path d="M104 12H130A54 54 0 0 1 184 66H156A26 26 0 0 0 130 40H104Z" fill="#ffffff"></path>
</svg>
<span style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px"><span style="color: #1abc9c">gpu</span>karaoke</span>
</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#000000","options":["#000000","#14161a","#1f2424"],"section":"Look"},"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
renderVals() {
return { bg: this.props.bg ?? '#000000' };
}
}
</script>
</body>
</html>
