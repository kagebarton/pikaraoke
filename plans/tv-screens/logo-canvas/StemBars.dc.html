<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo 4: Stem bars</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1abc9c}a:hover{color:#1dd2af}
</style>
</helmet>
<div style="width: 960px; height: 540px; box-sizing: border-box; padding: 48px; background: {{bg}}; color: #ffffff; font-family: Lato, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 36px">
<svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="GPUKaraoke mark: five sound bars, each split into a vocal part and a music part">
<g fill="#f1b70e">
<rect x="16" y="60" width="24" height="24" rx="12"></rect>
<rect x="52" y="30" width="24" height="50" rx="12"></rect>
<rect x="88" y="10" width="24" height="76" rx="12"></rect>
<rect x="124" y="40" width="24" height="36" rx="12"></rect>
<rect x="160" y="65" width="24" height="16" rx="8"></rect>
</g>
<g fill="#1abc9c">
<rect x="16" y="90" width="24" height="50" rx="12"></rect>
<rect x="52" y="86" width="24" height="84" rx="12"></rect>
<rect x="88" y="92" width="24" height="98" rx="12"></rect>
<rect x="124" y="82" width="24" height="78" rx="12"></rect>
<rect x="160" y="87" width="24" height="48" rx="12"></rect>
</g>
</svg>
<span style="font-size: 92px; font-weight: 900; letter-spacing: -2px; line-height: 1"><span style="color: #f1b70e">gpu</span>karaoke</span>
</div>
<div style="display: flex; align-items: center; gap: 40px; padding-top: 20px; border-top: 1px solid #282f2f">
<span style="font-size: 13px; color: #8c9b9d">Small sizes</span>
<svg width="48" height="48" viewBox="0 0 200 200" aria-hidden="true">
<g fill="#f1b70e">
<rect x="16" y="56" width="28" height="28" rx="14"></rect>
<rect x="56" y="26" width="28" height="54" rx="14"></rect>
<rect x="96" y="8" width="28" height="78" rx="14"></rect>
<rect x="136" y="40" width="28" height="36" rx="14"></rect>
</g>
<g fill="#1abc9c">
<rect x="16" y="94" width="28" height="50" rx="14"></rect>
<rect x="56" y="90" width="28" height="84" rx="14"></rect>
<rect x="96" y="96" width="28" height="96" rx="14"></rect>
<rect x="136" y="86" width="28" height="76" rx="14"></rect>
</g>
</svg>
<span style="display: flex; align-items: center; gap: 10px">
<svg width="28" height="28" viewBox="0 0 200 200" aria-hidden="true">
<g fill="#f1b70e">
<rect x="20" y="40" width="40" height="44" rx="20"></rect>
<rect x="80" y="8" width="40" height="78" rx="20"></rect>
<rect x="140" y="50" width="40" height="32" rx="16"></rect>
</g>
<g fill="#1abc9c">
<rect x="20" y="98" width="40" height="62" rx="20"></rect>
<rect x="80" y="100" width="40" height="92" rx="20"></rect>
<rect x="140" y="96" width="40" height="52" rx="20"></rect>
</g>
</svg>
<span style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px"><span style="color: #f1b70e">gpu</span>karaoke</span>
</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#000000","options":["#000000","#14161a","#1f2424"],"section":"Look"},"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
renderVals() {
return { bg: this.props.bg ?? '#000000' };
}
}
</script>
</body>
</html>
