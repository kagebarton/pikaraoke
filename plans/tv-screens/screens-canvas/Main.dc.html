<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inter-song screen, split layout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1abc9c}a:hover{color:#1dd2af}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; background: #000000; color: #ffffff; font-family: Lato, system-ui, sans-serif; overflow: hidden">

<sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}">
<section aria-label="Up next" style="position: absolute; left: 88px; top: 260px; right: 716px; bottom: 150px; display: flex; flex-direction: column; justify-content: center; gap: 28px">
<span style="font-size: 36px; font-weight: 700; letter-spacing: 6px; color: #b5bfc0">UP NEXT</span>
<span style="display: flex; align-items: center; gap: 28px; font-size: 150px; font-weight: 900; line-height: 1; color: #2ecc71; min-width: 0">
<svg width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 17v5"></path></svg>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{next.singer}}</span>
</span>
<span style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<span style="font-size: 76px; font-weight: 700; line-height: 1.1; color: #f1b70e; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden">{{next.title}}</span>
<span style="font-size: 52px; line-height: 1.1; color: #dbdee0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{next.artist}}</span>
</span>
<div style="display: flex; align-items: center; gap: 28px; margin-top: 24px">
<span style="flex: 1; position: relative; height: 14px; border-radius: 7px; background: #282f2f">
<span style="position: absolute; left: 0; top: 0; height: 14px; width: 62%; border-radius: 7px; background: #3298dc"></span>
</span>
<span style="font-size: 40px; font-weight: 700; color: #b5bfc0; white-space: nowrap">Starts in 0:08</span>
</div>
</section>
</sc-if>

<sc-if value="{{ noNext }}" hint-placeholder-val="{{ false }}">
<section aria-label="Waiting" style="position: absolute; left: 88px; top: 260px; right: 716px; bottom: 150px; display: flex; flex-direction: column; justify-content: center">
<span style="font-size: 76px; font-weight: 700; line-height: 1.15; color: #ffffff">{{message}}</span>
</section>
</sc-if>

<section aria-label="{{panelTitle}}" style="position: absolute; right: 16px; top: 16px; width: 620px; bottom: 150px; box-sizing: border-box; padding: 32px; border-radius: 20px; background: #1f2424; display: flex; flex-direction: column; gap: 26px">
<span style="font-size: 28px; font-weight: 700; letter-spacing: 5px; color: #b5bfc0">{{panelTitle}}</span>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 22px; min-width: 0">
<span style="flex: none; width: 80px; height: 80px; box-sizing: border-box; border-radius: 14px; background: {{r.slotBg}}; border: {{r.slotBorder}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; color: {{r.slotFg}}"><span style="font-size: 38px; font-weight: 900">{{r.n}}</span><span style="font-size: 14px; margin-top: 4px">{{r.word}}</span></span>
<span style="display: flex; flex-direction: column; gap: 6px; min-width: 0; opacity: {{r.fade}}">
<span style="font-size: 44px; font-weight: 900; line-height: 1.1; color: #2ecc71; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.singer}}</span>
<span style="font-size: 30px; line-height: 1.2; color: #dbdee0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.title}} · {{r.artist}}</span>
</span>
</div>
</sc-for>
<sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
<span style="margin-top: auto; font-size: 28px; color: #b5bfc0">+ {{more}} more in the queue</span>
</sc-if>
</section>

<sc-if value="{{ showUrl }}" hint-placeholder-val="{{ true }}">
<svg width="180" height="180" viewBox="0 0 120 120" role="img" aria-label="QR code placeholder" style="position: absolute; left: 16px; top: 16px">
<rect width="120" height="120" rx="8" fill="#ffffff"></rect>
<g fill="none" stroke="#000000" stroke-width="7"><rect x="14" y="14" width="28" height="28"></rect><rect x="78" y="14" width="28" height="28"></rect><rect x="14" y="78" width="28" height="28"></rect></g>
<g fill="#000000"><rect x="24" y="24" width="8" height="8"></rect><rect x="88" y="24" width="8" height="8"></rect><rect x="24" y="88" width="8" height="8"></rect><rect x="54" y="54" width="12" height="12"></rect><rect x="80" y="80" width="10" height="10"></rect><rect x="96" y="92" width="10" height="14"></rect><rect x="54" y="20" width="10" height="10"></rect><rect x="20" y="54" width="14" height="10"></rect></g>
</svg>
<span style="position: absolute; right: 16px; bottom: 16px; padding: 2px 12px; border-radius: 10px; background: rgba(0, 0, 0, 0.4); display: flex; align-items: baseline; gap: 14px; font-size: 34px; line-height: 1.2"><span style="font-weight: 700">Add a song</span><span style="color: #1abc9c">http://[server]:5555</span></span>
</sc-if>
<span style="position: absolute; left: 16px; bottom: 16px; padding: 0 12px; border-radius: 10px; background: rgba(0, 0, 0, 0.4); font-size: 52px; font-weight: 700; line-height: 1.15">9:42 PM</span>
<span style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px">
<svg width="52" height="52" viewBox="0 0 200 200" aria-hidden="true">
<g fill="#f1b70e"><rect x="16" y="56" width="28" height="28" rx="14"></rect><rect x="56" y="26" width="28" height="54" rx="14"></rect><rect x="96" y="8" width="28" height="78" rx="14"></rect><rect x="136" y="40" width="28" height="36" rx="14"></rect></g>
<g fill="#1abc9c"><rect x="16" y="94" width="28" height="50" rx="14"></rect><rect x="56" y="90" width="28" height="84" rx="14"></rect><rect x="96" y="96" width="28" height="96" rx="14"></rect><rect x="136" y="86" width="28" height="76" rx="14"></rect></g>
</svg>
<span style="font-size: 38px; font-weight: 900; letter-spacing: -1px"><span style="color: #f1b70e">gpu</span>karaoke</span>
</span>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","default":"queue","options":["queue","preparing","allPaused"],"section":"Queue"},"afterCount":{"editor":"int","default":4,"min":1,"max":5,"section":"Queue"},"queueLength":{"editor":"int","default":7,"min":1,"max":20,"section":"Queue"},"longNames":{"editor":"boolean","default":false,"section":"Queue"},"hideUrl":{"editor":"boolean","default":false,"section":"Display"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const long = this.props.longNames === true || this.props.longNames === 'true';
const hideUrl = this.props.hideUrl === true || this.props.hideUrl === 'true';
const state = this.props.state ?? 'queue';
const ready = { slotBg: '#282f2f', slotBorder: 'none', slotFg: '#ffffff', fade: 1, word: '' };
const held = (word) => ({ slotBg: 'transparent', slotBorder: '2px dashed #8c9b9d', slotFg: '#b5bfc0', fade: 0.4, word });
const song = (singer, title, artist, slot) => ({ singer, title, artist, ...slot });
let next = null;
let songs;
if (state === 'preparing') {
songs = [
song('Mina', 'Bohemian Rhapsody', 'Queen', held('downloading')),
song('Jae', 'Dancing Queen', 'ABBA', held('processing')),
song('Ken', 'Valerie', 'Amy Winehouse', held('lyrics')),
song('Priya', 'Mr. Brightside', 'The Killers', held('paused')),
];
} else if (state === 'allPaused') {
songs = [
song('Mina', 'Bohemian Rhapsody', 'Queen', held('paused')),
song('Jae', 'Dancing Queen', 'ABBA', held('paused')),
song('Ken', 'Valerie', 'Amy Winehouse', held('paused')),
];
} else {
next = long
? { singer: 'Mina and the Thursday Night Crew', title: 'Bohemian Rhapsody (Live at Wembley Stadium, Remastered 2011)', artist: 'Queen' }
: { singer: 'Mina', title: 'Bohemian Rhapsody', artist: 'Queen' };
songs = [
song('Jae', 'Dancing Queen', 'ABBA', ready),
song('Ken', 'Valerie', 'Amy Winehouse', held('processing')),
song(long ? 'Priyanka from accounts' : 'Priya', long ? "Don't Stop Believin' (2022 Remaster)" : 'Mr. Brightside', long ? 'Journey' : 'The Killers', held('paused')),
song('Sam', 'Rolling in the Deep', 'Adele', held('downloading')),
song('Leo', 'Africa', 'Toto', ready),
];
}
const count = next ? Math.max(1, Math.min(5, Number(this.props.afterCount ?? 4))) : songs.length;
const shown = songs.slice(0, count);
const first = next ? 2 : 1;
const rows = shown.map((s, i) => ({ ...s, n: i + first }));
const total = next ? Math.max(shown.length, Number(this.props.queueLength ?? 7) - 1) : shown.length;
return {
next: next || {},
hasNext: !!next,
noNext: !next,
message: state === 'allPaused' ? 'Every song in the queue is paused.' : 'Getting the first song ready.',
panelTitle: next ? 'AFTER THAT' : 'IN THE QUEUE',
rows,
hasMore: total > shown.length,
more: total - shown.length,
showUrl: !hideUrl,
};
}
}
</script>
</body>
</html>
